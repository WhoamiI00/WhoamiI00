<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Ankit Raj — Full-Stack Engineer">
  <title>Ankit Raj — Full-Stack Engineer</title>

  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0a09"/>
      <stop offset="55%" stop-color="#121010"/>
      <stop offset="100%" stop-color="#1a1715"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9663f" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#d9663f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d9663f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9663f"/>
      <stop offset="60%" stop-color="#e58b66" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e58b66" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ece6da" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ece6da" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ece6da" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ece6da" opacity="0.06"/>
    </pattern>

    <clipPath id="frame">
      <rect width="1200" height="280" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#ink)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <circle cx="960" cy="140" r="300" fill="url(#glow)"/>

    <!-- slow light sweep across the banner -->
    <rect width="360" height="280" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate"
        values="-400 0; 1240 0; 1240 0" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- orbit system, right side -->
    <g transform="translate(960 140)" fill="none" stroke="#d9663f">
      <circle r="112" stroke-opacity="0.16"/>
      <circle r="78"  stroke-opacity="0.24" stroke-dasharray="4 9">
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle r="46" stroke-opacity="0.34" stroke-dasharray="2 7">
        <animateTransform attributeName="transform" type="rotate"
          from="360" to="0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle r="15" stroke-opacity="0.55"/>

      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="12s" repeatCount="indefinite"/>
        <circle cx="112" cy="0" r="4.5" fill="#d9663f" stroke="none"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="180" to="540" dur="20s" repeatCount="indefinite"/>
        <circle cx="78" cy="0" r="3" fill="#e58b66" stroke="none"/>
      </g>
    </g>

    <!-- left text block -->
    <g transform="translate(84 0)">
      <text x="0" y="86" font-family="'Space Mono', ui-monospace, monospace"
            font-size="13" letter-spacing="4.5" fill="#d9663f">
        FULL-STACK ENGINEER
      </text>

      <text x="0" y="152" font-family="Georgia, 'Instrument Serif', serif"
            font-size="66" fill="#ece6da">
        Ankit Raj
      </text>

      <rect x="2" y="176" width="300" height="2" fill="url(#rule)"/>

      <text x="0" y="212" font-family="'Space Grotesk', system-ui, sans-serif"
            font-size="18" fill="#9a9286">
        Building scalable solutions — from the database to the user.
      </text>

      <text x="0" y="242" font-family="'Space Mono', ui-monospace, monospace"
            font-size="12.5" letter-spacing="1.6" fill="#5b554d">
        NeuralPort · Japan  ·  IIIT Jabalpur  ·  23.18° N / 79.98° E
      </text>
    </g>

    <rect width="1200" height="280" rx="14" fill="none"
          stroke="#ece6da" stroke-opacity="0.12"/>
  </g>
</svg>
